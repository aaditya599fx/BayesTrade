[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayestrade"
version = "1.0.0"
description = "Tabular Bayesian decision-making and synthetic execution research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
report = ["matplotlib>=3.8,<4", "reportlab>=4,<5"]

[project.scripts]
bayestrade = "bayestrade.study:main"

[tool.setuptools.packages.find]
where = ["src"]
